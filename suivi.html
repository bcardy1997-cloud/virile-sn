<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suivre ma commande — Virile-SN</title>
  <meta name="theme-color" content="#120f17">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="track">
  <div id="site-header"></div>

  <main class="container">
    <nav class="breadcrumb"><a href="index.html">Accueil</a> › <span>Suivre ma commande</span></nav>
    <div class="track-wrap">
      <div class="track-search">
        <h1 style="font-size:clamp(1.6rem,3vw,2.2rem)">Suivre ma commande</h1>
        <p class="muted">Saisissez le numéro reçu lors de votre commande (ex. <b>VS-261005-AB12</b>).</p>
        <form id="track-form" autocomplete="off">
          <div class="field"><label for="t-ref">Numéro de commande</label><input id="t-ref" name="ref" placeholder="VS-XXXXXX-XXXX" style="text-transform:uppercase" required></div>
          <div class="field"><label for="t-tel">4 derniers chiffres de votre téléphone</label><input id="t-tel" name="tel" inputmode="numeric" maxlength="4" placeholder="ex. 4567"></div>
          <button class="btn btn-primary" type="submit" style="height:48px">Suivre</button>
        </form>
        <p class="muted" style="font-size:.8rem;margin:12px 0 0">Démo : essayez <b>VS-DEMO-0001</b> avec <b>0000</b>.</p>
      </div>
      <div id="result"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="js/config.js"></script>
  <script src="js/produits.js"></script>
  <script src="js/app.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/suivi.js"></script>
</body>
</html>
